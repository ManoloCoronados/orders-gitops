apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-service-config
  namespace: orders
data:
  KAFKA_BOOTSTRAP_SERVERS: "orders-kafka-kafka-bootstrap.kafka.svc:9092"
  KAFKA_TOPIC_ORDERS_CREATED: "orders.created.v1"
  DB_HOST: "orders-postgres"
  DB_PORT: "5432"
  DB_NAME: "orders"
  KAFKA_PRODUCER_ACKS: "all"
  KAFKA_PRODUCER_BATCH_SIZE: "16384"
  KAFKA_PRODUCER_LINGER_MS: "5"
  KAFKA_PRODUCER_MAX_BLOCK_MS: "5000"
  KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS: "30000"
  KAFKA_PRODUCER_REQUEST_TIMEOUT_MS: "5000"
  OUTBOX_METRICS_REFRESH_INTERVAL_MS: "10000"
  OUTBOX_RELAY_WORKERS: "2"
  OUTBOX_RELAY_BATCH_SIZE: "50"
  OUTBOX_RELAY_POLL_INTERVAL_MS: "1000"
  OUTBOX_RELAY_LEASE_SECONDS: "30"
  OUTBOX_RELAY_PUBLISH_TIMEOUT_MS: "10000"
  OUTBOX_RELAY_MAX_ATTEMPTS: "5"
  OUTBOX_RELAY_BACKOFF_BASE_MS: "1000"
  OUTBOX_RELAY_BACKOFF_MAX_MS: "60000"
  OUTBOX_RELAY_SHUTDOWN_AWAIT_SECONDS: "20"
  OUTBOX_RETENTION_DAYS: "7"